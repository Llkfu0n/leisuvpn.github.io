<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>安全验证</title>
    <style>
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background-color: #000;
        color: #fff;
        margin: 0;
        font-family: Arial, sans-serif;
        flex-direction: column;
        overflow: hidden;
      }

      #main-content {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        width: 100%;
        padding: 0 1rem;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 3rem;
        font-weight: bold;
        line-height: 1.33333;
      }

      .text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        font-size: 1.5rem;
        line-height: 1.33333;
      }

      .lds-ellipsis {
        display: inline-block;
        position: relative;
        width: 40px;
        height: 10px;
      }

      .lds-ellipsis div {
        position: absolute;
        top: 2px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
        animation-timing-function: cubic-bezier(0, 1, 1, 0);
      }

      .lds-ellipsis div:nth-child(1) { left: 6px; animation: lds-ellipsis1 0.6s infinite; }
      .lds-ellipsis div:nth-child(2) { left: 6px; animation: lds-ellipsis2 0.6s infinite; }
      .lds-ellipsis div:nth-child(3) { left: 17px; animation: lds-ellipsis2 0.6s infinite; }
      .lds-ellipsis div:nth-child(4) { left: 28px; animation: lds-ellipsis3 0.6s infinite; }

      @keyframes lds-ellipsis1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
      @keyframes lds-ellipsis2 { 0% { transform: translate(0, 0); } 100% { transform: translate(10px, 0); } }
      @keyframes lds-ellipsis3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }

      @media (prefers-reduced-motion: reduce) {
        .lds-ellipsis div { animation: none; opacity: 0.7; }
      }

      #backup-btn {
        display: none;
        margin-top: 2rem;
        padding: 10px 20px;
        background-color: transparent;
        border: 2px solid #fff;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.3s, color 0.3s;
      }

      #backup-btn:hover,
      #backup-btn:focus-visible {
        background-color: #fff;
        color: #000;
        outline: none;
      }

      #captcha-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      .captcha-title {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        font-weight: bold;
        letter-spacing: 2px;
      }

      .slider-box {
        position: relative;
        width: 300px;
        max-width: calc(100vw - 2rem);
        height: 45px;
        background-color: #222;
        border: 1px solid #444;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        touch-action: none;
      }

      .slider-text {
        position: absolute;
        width: 100%;
        height: 100%;
        text-align: center;
        line-height: 45px;
        font-size: 0.95rem;
        color: #aaa;
        user-select: none;
        z-index: 1;
        pointer-events: none;
      }

      .slider-bg {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        background-color: rgba(255, 255, 255, 0.2);
        z-index: 2;
        pointer-events: none;
      }

      .slider-block {
        position: absolute;
        left: 0;
        top: 0;
        width: 45px;
        height: 45px;
        background-color: #fff;
        border-radius: 50%;
        cursor: grab;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        transition: background-color 0.3s, left 0.25s ease, box-shadow 0.2s;
        touch-action: none;
      }

      .slider-block.is-dragging {
        transition: background-color 0.3s;
        cursor: grabbing;
      }

      .slider-block:focus-visible {
        outline: 2px solid #4cd964;
        outline-offset: 2px;
      }

      .slider-block::before {
        content: "➔";
        color: #000;
        font-size: 1.2rem;
        font-weight: bold;
      }

      .slider-box.success .slider-text {
        color: #fff;
      }

      .slider-box.success .slider-block {
        background-color: #4cd964;
        cursor: default;
      }

      .slider-box.success .slider-block::before {
        content: "✓";
        color: #fff;
      }

      @media (max-width: 768px) {
        html { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="captcha-container">
      <div class="captcha-title" id="captchaTitle">请完成安全验证</div>
      <div
        class="slider-box"
        id="sliderBox"
        role="slider"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-labelledby="captchaTitle"
        aria-valuetext="向右滑动滑块验证"
      >
        <div class="slider-text" id="sliderText">向右滑动滑块验证</div>
        <div class="slider-bg" id="sliderBg"></div>
        <div class="slider-block" id="sliderBlock" tabindex="0" aria-hidden="true"></div>
      </div>
    </div>

    <div id="main-content">
      <h1>安全检查</h1>
      <div class="text" id="info" aria-live="polite">
        正在为您选择最优线路
        <div class="lds-ellipsis" aria-hidden="true">
          <div></div><div></div><div></div><div></div>
        </div>
      </div>
      <button type="button" id="backup-btn">手动进入备用网址</button>
    </div>

    <script>
      const backupUrl = "http://154.44.20.58:8080/";
      const jumpDelay = 3000;
      const timeout = 30000;

      const nodes = [
        { jumpUrl: "https://apple.airport-ls.top/", testImg: "https://apple.airport-ls.top/images/favicon.ico" },
        { jumpUrl: "https://china.airport-ls.top/", testImg: "https://china.airport-ls.top/images/favicon.ico" },
        { jumpUrl: "https://leisu-next.netlify.app/", testImg: "https://leisu-next.netlify.app/images/favicon.ico" },
        { jumpUrl: "https://leisu-next.pages.dev/", testImg: "https://leisu-next.pages.dev/images/favicon.ico" },
        { jumpUrl: "https://welfare.hushitanke.top/", testImg: "https://welfare.hushitanke.top/images/favicon.ico" }
      ];

      let jumped = false;
      let failCount = 0;
      let timeoutTimer = null;
      let jumpTimer = null;

      function withPathSuffix(baseUrl) {
        const suffix = window.location.pathname + window.location.search + window.location.hash;
        return baseUrl.replace(/\/+$/, "") + suffix;
      }

      function goBackup() {
        window.location.href = withPathSuffix(backupUrl);
      }

      function showRouteError() {
        if (jumped) return;
        const info = document.getElementById("info");
        info.textContent = "线路异常，请尝试手动进入备用网址";
        document.getElementById("backup-btn").style.display = "inline-block";
      }

      function testNode(node) {
        if (jumped) return;

        const img = new Image();
        const finishFail = function () {
          if (jumped) return;
          failCount += 1;
          if (failCount >= nodes.length) {
            clearTimeout(timeoutTimer);
            showRouteError();
          }
        };

        img.onload = function () {
          if (jumped) return;
          jumped = true;
          clearTimeout(timeoutTimer);

          jumpTimer = setTimeout(function () {
            window.location.href = withPathSuffix(node.jumpUrl);
          }, jumpDelay);
        };

        img.onerror = finishFail;
        img.src = node.testImg + "?t=" + Date.now();
      }

      function startCheck() {
        document.getElementById("captcha-container").style.display = "none";
        document.getElementById("main-content").style.display = "flex";

        nodes.forEach(testNode);

        timeoutTimer = setTimeout(showRouteError, timeout);
      }

      document.getElementById("backup-btn").addEventListener("click", goBackup);
    </script>

    <script>
      (function () {
        const box = document.getElementById("sliderBox");
        const block = document.getElementById("sliderBlock");
        const bg = document.getElementById("sliderBg");
        const text = document.getElementById("sliderText");

        let isDrag = false;
        let startX = 0;
        let maxLeft = 0;
        let currentLeft = 0;

        function getMaxLeft() {
          return Math.max(0, box.clientWidth - block.clientWidth);
        }

        function setPosition(moveX, withTransition) {
          currentLeft = moveX;
          block.classList.toggle("is-dragging", !withTransition && isDrag);
          if (withTransition) {
            block.classList.remove("is-dragging");
          }
          block.style.left = moveX + "px";
          bg.style.width = moveX + "px";
          bg.style.transition = withTransition ? "width 0.25s ease" : "none";

          const percent = maxLeft ? Math.round((moveX / maxLeft) * 100) : 0;
          box.setAttribute("aria-valuenow", String(percent));
        }

        function succeed() {
          isDrag = false;
          block.classList.remove("is-dragging");
          box.classList.add("success");
          text.textContent = "验证通过";
          box.setAttribute("aria-valuenow", "100");
          box.setAttribute("aria-valuetext", "验证通过");
          block.removeAttribute("tabindex");
          removeListeners();
          setTimeout(startCheck, 400);
        }

        function dragStart(e) {
          if (box.classList.contains("success")) return;
          if (e.cancelable) e.preventDefault();

          isDrag = true;
          maxLeft = getMaxLeft();
          const clientX = e.clientX != null ? e.clientX : e.touches[0].clientX;
          startX = clientX - block.offsetLeft;
          block.classList.add("is-dragging");
          bg.style.transition = "none";
        }

        function dragMove(e) {
          if (!isDrag) return;
          if (e.cancelable) e.preventDefault();

          const point = e.touches && e.touches.length ? e.touches[0] : e;
          if (point.clientX == null) return;

          let moveX = point.clientX - startX;
          if (moveX < 0) moveX = 0;
          if (moveX > maxLeft) moveX = maxLeft;

          setPosition(moveX, false);

          if (moveX >= maxLeft) {
            succeed();
          }
        }

        function dragEnd() {
          if (!isDrag) return;
          isDrag = false;
          block.classList.remove("is-dragging");

          if (!box.classList.contains("success")) {
            setPosition(0, true);
            box.setAttribute("aria-valuetext", "向右滑动滑块验证");
          }
        }

        function onKeyDown(e) {
          if (box.classList.contains("success")) return;

          maxLeft = getMaxLeft();
          const step = Math.max(8, Math.round(maxLeft / 10));

          if (e.key === "ArrowRight" || e.key === "Right") {
            e.preventDefault();
            const next = Math.min(maxLeft, currentLeft + step);
            setPosition(next, false);
            if (next >= maxLeft) succeed();
          } else if (e.key === "ArrowLeft" || e.key === "Left") {
            e.preventDefault();
            setPosition(Math.max(0, currentLeft - step), false);
          } else if (e.key === "Home") {
            e.preventDefault();
            setPosition(0, true);
          } else if (e.key === "End") {
            e.preventDefault();
            setPosition(maxLeft, false);
            succeed();
          }
        }

        function removeListeners() {
          block.removeEventListener("mousedown", dragStart);
          document.removeEventListener("mousemove", dragMove);
          document.removeEventListener("mouseup", dragEnd);
          block.removeEventListener("touchstart", dragStart);
          document.removeEventListener("touchmove", dragMove);
          document.removeEventListener("touchend", dragEnd);
          box.removeEventListener("keydown", onKeyDown);
        }

        block.addEventListener("mousedown", dragStart);
        document.addEventListener("mousemove", dragMove);
        document.addEventListener("mouseup", dragEnd);

        block.addEventListener("touchstart", dragStart, { passive: false });
        document.addEventListener("touchmove", dragMove, { passive: false });
        document.addEventListener("touchend", dragEnd);

        box.addEventListener("keydown", onKeyDown);
        maxLeft = getMaxLeft();
      })();
    </script>
  </body>
</html>
